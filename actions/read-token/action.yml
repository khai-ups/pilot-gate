name: Mint relay token (Broker B v2)
description: >
  Mints a short-lived, scoped GitHub App (pilot-watch) installation token.
  The real App PEM never enters the calling job. Instead, this action dispatches
  a gate workflow that holds the PEM behind a strict WIF condition, mints the
  token there, and writes it to a GCP Secret Manager relay secret. This action
  reads it back after the gate completes and outputs the masked token.

  Authorization is checked inside the gate using the caller's GITHUB_WORKFLOW_REF,
  which the composite action forwards as a dispatch input. The gate rejects callers
  not in its mapping.

  Pilot limitation: single relay secret (not per-run); simultaneous callers will
  clobber each other's relay version. Cleanup is best-effort (dispatched as
  fire-and-forget in the final step).

inputs:
  repos:
    required: false
    default: pilot-terragrunt-modules
    description: Comma-separated repos (without owner) to scope the token to.

outputs:
  token:
    description: Short-lived installation token, valid for ~1 hour.
    value: ${{ steps.read-sm.outputs.token }}

runs:
  using: composite
  steps:
    - id: key
      name: Set relay key
      shell: bash
      run: echo "key=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - id: gcp-auth
      name: Authenticate to GCP (pilot-caller-provider)
      uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
      with:
        project_id: upsidr-platform-dev
        workload_identity_provider: projects/41914822026/locations/global/workloadIdentityPools/github-pilot/providers/pilot-caller-provider

    - id: fetch-trigger-pem
      name: Fetch trigger App PEM
      uses: google-github-actions/get-secretmanager-secrets@95a0b09b8348ef3d02c68c6ba5662a037e78d713 # v2.1.4
      with:
        secrets: |-
          pem:projects/upsidr-platform-dev/secrets/pilot-gate-github-app-pem

    - id: trigger-token
      name: Mint trigger App token (actions:write on pilot-gate)
      uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
      with:
        app-id: 4735115
        private-key: ${{ steps.fetch-trigger-pem.outputs.pem }}
        owner: khai-ups
        repositories: pilot-gate

    - id: dispatch
      name: Dispatch gate mint
      shell: bash
      env:
        GH_TOKEN: ${{ steps.trigger-token.outputs.token }}
      run: |
        gh workflow run mint-token.yml \
          --repo khai-ups/pilot-gate \
          --field operation=mint \
          --field repos="${{ inputs.repos }}" \
          --field caller_ref="${GITHUB_WORKFLOW_REF}" \
          --field key="${{ steps.key.outputs.key }}"
        echo "Dispatched mint-token.yml: repos=${{ inputs.repos }} key=${{ steps.key.outputs.key }}"

    - id: poll
      name: Wait for gate run to complete
      shell: bash
      env:
        GH_TOKEN: ${{ steps.trigger-token.outputs.token }}
      run: |
        # Allow a moment for the dispatch to register in the API
        sleep 8

        GATE_RUN_ID=""
        for i in $(seq 1 10); do
          GATE_RUN_ID=$(gh run list \
            --repo khai-ups/pilot-gate \
            --workflow=mint-token.yml \
            --event=workflow_dispatch \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || echo "")
          [[ -n "$GATE_RUN_ID" ]] && break
          sleep 3
        done

        if [[ -z "$GATE_RUN_ID" ]]; then
          echo "ERROR: could not find dispatched gate run"
          exit 1
        fi

        echo "gate_run_id=$GATE_RUN_ID" >> "$GITHUB_OUTPUT"
        echo "Polling gate run $GATE_RUN_ID..."

        for i in $(seq 1 36); do
          STATUS=$(gh run view "$GATE_RUN_ID" \
            --repo khai-ups/pilot-gate \
            --json status \
            --jq '.status')
          if [[ "$STATUS" == "completed" ]]; then
            CONCLUSION=$(gh run view "$GATE_RUN_ID" \
              --repo khai-ups/pilot-gate \
              --json conclusion \
              --jq '.conclusion')
            if [[ "$CONCLUSION" != "success" ]]; then
              echo "ERROR: gate run $GATE_RUN_ID failed ($CONCLUSION)"
              exit 1
            fi
            echo "Gate run $GATE_RUN_ID completed successfully"
            exit 0
          fi
          echo "[$i/36] status=$STATUS, waiting 10s..."
          sleep 10
        done

        echo "ERROR: timeout waiting for gate run $GATE_RUN_ID"
        exit 1

    - id: read-sm
      name: Read token from SM relay
      shell: bash
      run: |
        TOKEN=$(gcloud secrets versions access latest \
          --secret=pilot-token-relay \
          --project=upsidr-platform-dev)
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

    - id: dispatch-cleanup
      name: Dispatch gate cleanup (best-effort, fire-and-forget)
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.trigger-token.outputs.token }}
      run: |
        gh workflow run mint-token.yml \
          --repo khai-ups/pilot-gate \
          --field operation=cleanup \
          --field key="${{ steps.key.outputs.key }}" \
          || echo "Cleanup dispatch failed (non-fatal)"
