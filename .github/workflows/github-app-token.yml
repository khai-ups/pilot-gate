name: Deliver via App Token

on:
  workflow_call:
    inputs:
      target_repo:
        required: false
        type: string
        default: pilot-delivery
        description: Repo (without owner) to check out and open the PR against.
      pr_branch:
        required: false
        type: string
        default: automation/update-image-tag
      pr_title:
        required: false
        type: string
        default: "[Automated] Update image tag (pilot)"
      pr_body:
        required: false
        type: string
        default: PLF-3217 pilot - proves the App-token broker path end to end.

permissions:
  id-token: write
  contents: read

jobs:
  deliver:
    name: Mint token and create delivery PR
    runs-on: ubuntu-latest
    steps:
      - id: gcp-auth
        name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          project_id: upsidr-platform-dev
          workload_identity_provider: projects/41914822026/locations/global/workloadIdentityPools/github-pilot/providers/pilot-gate-provider

      - id: fetch-pem
        name: Fetch App private key
        uses: google-github-actions/get-secretmanager-secrets@95a0b09b8348ef3d02c68c6ba5662a037e78d713 # v2.1.4
        with:
          secrets: |-
            pem:projects/upsidr-platform-dev/secrets/pilot-gate-github-app-pem

      - id: app-token
        name: Mint installation token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
        with:
          app-id: 4735115
          private-key: ${{ steps.fetch-pem.outputs.pem }}
          owner: khai-ups
          repositories: ${{ inputs.target_repo }}

      - name: Checkout target repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: khai-ups/${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target

      - name: Bump image tag
        run: echo "pilot-$(date -u +%Y%m%d%H%M%S)" > target/image-tag.txt
        env:
          TZ: UTC

      - name: Create Delivery PR
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          path: target
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ inputs.pr_branch }}
          delete-branch: true
          title: ${{ inputs.pr_title }}
          body: ${{ inputs.pr_body }}
          committer: pilot-gate-broker <noreply@github.com>
          author: pilot-gate-broker <noreply@github.com>
