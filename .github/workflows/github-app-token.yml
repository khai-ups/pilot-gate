name: Dispatch via App Token

on:
  workflow_call:
    inputs:
      target_repo:
        required: false
        type: string
        default: pilot-delivery
        description: Repo (without owner) whose workflow should be dispatched.
      target_workflow:
        required: false
        type: string
        default: deliver.yml
        description: Workflow file (in target_repo) to dispatch.
      ref:
        required: false
        type: string
        default: main
        description: Branch in target_repo to run the dispatched workflow on.
      dispatch_inputs_json:
        required: false
        type: string
        default: '{}'
        description: JSON object of inputs to pass to the dispatched workflow (must match its own workflow_dispatch.inputs).

permissions:
  id-token: write
  contents: read

jobs:
  dispatch:
    name: Mint token and dispatch target workflow
    runs-on: ubuntu-latest
    steps:
      - id: gcp-auth
        name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          project_id: upsidr-platform-dev
          workload_identity_provider: projects/41914822026/locations/global/workloadIdentityPools/github-pilot/providers/pilot-gate-provider

      - id: fetch-pem
        name: Fetch App private key
        uses: google-github-actions/get-secretmanager-secrets@95a0b09b8348ef3d02c68c6ba5662a037e78d713 # v2.1.4
        with:
          secrets: |-
            pem:projects/upsidr-platform-dev/secrets/pilot-gate-github-app-pem

      - id: app-token
        name: Mint installation token (actions:write only)
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.6
        with:
          app-id: 4735115
          private-key: ${{ steps.fetch-pem.outputs.pem }}
          owner: khai-ups
          repositories: ${{ inputs.target_repo }}
          # Per-permission narrowing (permission-actions) needs a newer action
          # version than this pin supports - scoping instead relies entirely on
          # the App itself being granted only Actions: Read and write.

      - name: Dispatch target workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_INPUTS_JSON: ${{ inputs.dispatch_inputs_json }}
        run: |
          jq -n --arg ref "${{ inputs.ref }}" --argjson inputs "$DISPATCH_INPUTS_JSON" \
            '{ref: $ref, inputs: $inputs}' | \
          gh api "repos/khai-ups/${{ inputs.target_repo }}/actions/workflows/${{ inputs.target_workflow }}/dispatches" \
            --input -
