name: Revoke GitHub App installation token
description: Revokes a token minted by kms-app-token. Call it as the last step with if always().

inputs:
  token:
    required: true
    description: Token from kms-app-token.

runs:
  using: composite
  steps:
    - name: Revoke token
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then echo "no token to revoke"; exit 0; fi
        code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
          -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/installation/token)
        echo "revoke: HTTP $code (204 = revoked)"
